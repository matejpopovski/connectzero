name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen clang-format --dry-run --Werror cpp/board.hpp cpp/mcts.hpp cpp/parallel.hpp cpp/players.hpp cpp/pool.hpp cpp/rng.hpp cpp/solver.hpp cpp/bindings.cpp cpp/mcts.cpp cpp/players.cpp cpp/pool.cpp cpp/solver.cpp
      - run: uv run --frozen pytest -m "not slow"
